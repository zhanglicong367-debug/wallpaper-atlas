<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clash Atlas | GitHub 免费订阅源导航</title>
    <meta
      name="description"
      content="自动从 GitHub 搜集公开 Clash 免费订阅项目和站点入口，支持搜索、筛选、收藏和定时刷新。"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script defer src="./script.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Clash Atlas 首页">
        <span class="brand-mark">CA</span>
        <span>
          <strong>Clash Atlas</strong>
          <small>GitHub free Clash index</small>
        </span>
      </a>

      <nav class="nav-actions" aria-label="主要操作">
        <a
          class="icon-link"
          href="https://github.com/zhanglicong367-debug/wallpaper-atlas"
          target="_blank"
          rel="noreferrer"
          title="GitHub 仓库"
        >
          <i data-lucide="github"></i>
          <span>GitHub</span>
        </a>
        <button class="icon-button" id="themeToggle" type="button" title="切换主题">
          <i data-lucide="moon"></i>
        </button>
      </nav>
    </header>

    <main>
      <section class="control-band" aria-labelledby="pageTitle">
        <div class="intro">
          <p class="eyebrow">实时搜集公开 GitHub 项目</p>
          <h1 id="pageTitle">Clash 免费订阅站点自动导航</h1>
          <p>
            页面会从 GitHub 搜索公开项目，合并内置种子源，并定时刷新最近更新的免费订阅入口。
            所有结果都来自公开仓库，请自行确认可用性和合规性。
          </p>
        </div>

        <div class="search-panel" role="search">
          <label class="search-box" for="searchInput">
            <i data-lucide="search"></i>
            <input id="searchInput" type="search" placeholder="搜索：clash、订阅、机场、节点、yaml、daily..." autocomplete="off" />
          </label>

          <div class="filter-row" id="categoryFilters" aria-label="分类筛选"></div>

          <div class="collector-bar">
            <div class="status-line">
              <i data-lucide="refresh-cw"></i>
              <span id="collectorStatus" role="status">正在准备从 GitHub 搜集</span>
            </div>
            <button class="action-button primary" id="refreshButton" type="button">
              <i data-lucide="rotate-cw"></i>
              <span>立即更新</span>
            </button>
          </div>
        </div>
      </section>

      <section class="stats-band" aria-label="站点统计">
        <div>
          <strong id="resultCount">0</strong>
          <span>当前结果</span>
        </div>
        <div>
          <strong id="totalCount">0</strong>
          <span>已收集</span>
        </div>
        <div>
          <strong id="favoriteCount">0</strong>
          <span>已收藏</span>
        </div>
        <div>
          <strong id="lastUpdated">--</strong>
          <span>最近更新</span>
        </div>
      </section>

      <section class="notice-band">
        <i data-lucide="shield-alert"></i>
        <p>
          本站只聚合公开 GitHub 项目入口，不托管、不检测、不转发代理节点。免费订阅常会失效，请优先查看项目 README 和更新日期。
        </p>
      </section>

      <section class="source-grid" id="sourceGrid" aria-label="Clash 站点列表"></section>
    </main>
  </body>
</html>
